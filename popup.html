<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>YojanaGPT</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="extension-container">

    <!-- HEADER -->
    <header class="app-header">
        <div class="logo">
            <h1>Yojana<span>GPT</span></h1>
            <div class="status-dot"></div>
        </div>
        <p>Government Scheme Assistant</p>
    </header>

    <!-- PAGE INFO -->
    <section class="summary-section">
        <div class="summary-header">
            <span>📄</span>
            <h3>Page Detected</h3>
        </div>
        <div class="summary-card">
            <div class="summary-item">
                <strong>Title:</strong>
                <span id="pageTitle">Reading...</span>
            </div>
            <div class="summary-item">
                <strong>URL:</strong>
                <span id="pageURL">-</span>
            </div>
        </div>
    </section>

    <!-- STATUS -->
    <section class="summary-section">
        <div class="summary-card">
            <div class="summary-item" id="highlightStatus">
                ⏳ Reading page...
            </div>
        </div>
    </section>

    <!-- PAGE TEXT -->
    <main class="chat-window" id="chatWindow">
        <div class="message ai-msg" id="textOutput">
            ⏳ Loading...
        </div>
    </main>

    <footer class="input-section">
        <div class="input-wrapper">
            <input type="text" placeholder="Coming soon..." disabled />
            <button disabled>
                <svg viewBox="0 0 24 24" width="18" height="18">
                    <path fill="currentColor" d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                </svg>
            </button>
        </div>
    </footer>

</div>
<script src="popup.js"></script>
</body>
</html>
