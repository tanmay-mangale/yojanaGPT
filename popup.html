<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>YojanaGPT</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="extension-container">

    <header class="app-header">
        <div class="logo">
            <h1>Yojana<span>GPT</span></h1>
            <div class="status-dot"></div>
        </div>
        <p>Government Scheme Assistant</p>
    </header>

    <section class="summary-section">
        <div class="summary-header">
            <span>📄</span>
            <h3>Page Detected</h3>
        </div>
        <div class="summary-card">
            <div class="summary-item">
                <strong>Title:</strong>
                <span id="pageTitle">Reading...</span>
            </div>
            <div class="summary-item">
                <strong>URL:</strong>
                <span id="pageURL">-</span>
            </div>
        </div>
    </section>

    <section class="summary-section">
        <div class="summary-card">
            <div class="summary-item" id="highlightStatus">
                ⏳ Reading page...
            </div>
        </div>
    </section>

    <main class="chat-window" id="chatWindow">
        <div class="summary-toolbar-wrap">
            <div class="chat-label">Scheme summary</div>
            <div class="translate-toolbar" id="translateToolbar" hidden>
                <span class="translate-label">Translate:</span>
                <button type="button" class="btn-translate" id="btnLangEn" title="Show original English summary">English</button>
                <button type="button" class="btn-translate" id="btnLangHi" title="Translate summary to Hindi">हिंदी</button>
                <button type="button" class="btn-translate" id="btnLangMr" title="Translate summary to Marathi">मराठी</button>
            </div>
        </div>
        <p class="translate-error" id="translateError" hidden></p>
        <div class="message ai-msg" id="summaryBlock">
            ⏳ Loading...
        </div>
        <div class="chat-label chat-label-followup" id="followupLabel" hidden>Your questions</div>
        <div id="chatMessages" class="chat-messages"></div>
    </main>

    <footer class="input-section">
        <div class="input-wrapper" id="inputWrapper">
            <input type="text" id="chatInput" placeholder="Ask about this scheme (loads after summary)..." disabled autocomplete="off" />
            <button type="button" id="sendBtn" disabled title="Send" aria-label="Send">
                <svg viewBox="0 0 24 24" width="18" height="18">
                    <path fill="currentColor" d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                </svg>
            </button>
        </div>
    </footer>

</div>
<script src="popup.js"></script>
</body>
</html>
